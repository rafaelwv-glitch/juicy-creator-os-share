name: Desktop packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Package Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npm run desktop:publish
          else
            npm run desktop:build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: juicy-creator-os-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/latest-linux.yml
          if-no-files-found: error
      - name: Attach Linux packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          shopt -s nullglob
          files=(release/*.AppImage release/Juicy-Creator-OS-*.tar.gz)
          if [[ -f release/latest-linux.yml ]]; then
            files+=(release/latest-linux.yml)
          fi
          if (( ${#files[@]} == 0 )); then
            echo "no linux packages in release/" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Package Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npm run desktop:publish:win
          else
            npm run desktop:build:win
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: juicy-creator-os-windows
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
          if-no-files-found: error
      - name: Attach Windows packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes
          }
          $files = @(Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -in '.exe','.zip','.yml','.yaml' -and $_.Name -notmatch 'blockmap'
          } | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "no windows packages in release/" }
          gh release upload $env:GITHUB_REF_NAME @files --clobber
