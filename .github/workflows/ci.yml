name: CI
on:
  push:
    branches: [main, local, desktop]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit || true
      - run: npm run smoke:qa
      - run: npm run smoke
        env:
          VITE_AUTH_ENABLED: "false"
